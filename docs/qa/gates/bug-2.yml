      - "docs/story-records/bug-2/dev-1.1.md, 섹션 `Cleaner 결과`의 F-3"
    first_round: 1
    verification: "엔진의 까닭 글자를 빈 글자로 바꾼 사본에서 `node --test`가 76개 통과하고 `node ci/screen-rule.check.mjs`가 종료 상태 0이다. 전달 모듈의 메시지는 `expression nested too deeply at position 0`이다. 제안한 단언을 더한 사본은 통제에서 엔진 시험 38개가 통과하고, 까닭을 빈 글자로 바꾸면 이 시험 하나가 실패한다."
  - id: DOC-001
    severity: low
    disposition: optional
    confidence: high
    suggested_owner: dev
    finding: "Dev 기록 dev-1.1의 두 문장이 실제와 다르다. 첫째, 머리의 시각 `첫 RED 02:09`다. Dev가 남긴 조각 1의 RED 출력의 수정 시각은 02:07:12이고 조각 5의 출력이 02:09:42다. 둘째, 섹션 `Cleaner 결과`의 `검토자의 변형 가운데 76/76을 통과한 것은 위 표의 둘과 Story가 예고한 틈`과 그 괄호의 나열이다. 위 표의 catch-every-other-error는 Dev의 변형이고 검토자의 요약에 없으며, 검토자의 요약에서 76개를 통과한 depth-limit-above-the-fitting-depth가 괄호에 없다. 그 변형도 Story가 예고한 틈이어서 일반 문장은 맞고 나열만 덜 정확하다. RED, GREEN, Cleaner, 재점검의 순서와 그 밖의 값은 저장된 출력과 같다. 두 문장은 Story 자신의 실행 기록이어서 결정 순서 step 3의 `description of current content`가 아니고, 나열을 완전한 목록으로 쓰는 곳이 없으며, 잘못된 결과가 없어 step 4도 아니다. 비차단이다. 프로젝트의 재발 항목 `[Tech-Debt] 재발: 기록의 서술이 실제와 다름`과 같은 기준이다."
