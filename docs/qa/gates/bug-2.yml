    severity: low
    disposition: optional
    confidence: high
    suggested_owner: dev
    finding: "표 1 G-4의 `D`의 까닭이 빈 글자가 아니고를 보는 단언이 실제로 빈 까닭을 가리지 못한다. 시험 `gives a different reason in the message for different problems`의 `reason.trim()`은 `reasonOf`가 메시지에서 수만 뺀 글자를 보는데, 까닭이 빈 글자여도 ` at position `이 남아 통과한다. 까닭을 빈 글자로 쓴 변이가 76개를 모두 통과한다. Cleaner F-3이 같은 틈을 보고 단언 문구만 고쳤고 Dev 기록은 bug-2-INSP-001의 읽기에 맡겼으나, Story의 `coverage_gaps`에는 이 틈이 이름으로 없다. 전달된 까닭은 `expression nested too deeply`여서 제품은 맞다. 판정 방법이 까닭을 메시지에서 수를 뺀 글자로 정했으므로 전달 시험은 그 판정대로 G-4에 닿아 결정 순서 step 3의 미충족이 아니고, 틀린 일이 통과할 수 있다는 가능성만으로는 step 4도 아니다. 비차단이다."
    failure_scenario: "뒤의 수정이 까닭을 지우거나 빈 글자로 두면 오류 줄이 `오류:  at position 0`이 되어도 시험이 통과한다. 지금 코드에는 이 결과가 없다."
    suggested_action: "Dev가 처리를 정해 Completion Notes에 처리 줄을 남긴다. 계약 안에서 고치면 낱말을 시험에 적지 않고, `D`의 까닭에서 다른 문제의 까닭과 겹치는 꼬리를 걷어낸 나머지가 비어 있지 않은지 같은 시험에서 본다. `future`로 두면 항목 `오류 메시지의 언어와 꼴`의 답이 낱말을 정할 때 함께 본다."
    refs:
