# 사용자의 결정을 승인으로 한 면제다. 조사 요건을 채운 것이 아니다
waiver:
  active: true
  reason: "ARCH-001. 규칙은 `AGENTS.md` 섹션 Research for uncertainty and core implementation decisions의 참고 자료 다섯 개 이상 조사와 `.bmad-core/tasks/research-decision.md` step 2, step 7이다. 위반은 설계 `재귀 파서를 그대로 두고, 스택 넘침의 RangeError를 evaluate 경계에서 잡아 CalculationError로 바꿈`이 그 조사 없이 정해져 `src/engine.js`의 `evaluate`에 구현된 것이다. 범위는 이 Story의 이 설계이고 검토한 입력은 HEAD 4c7fb2f(구현 개정 4a69ac7)다. 까닭과 승인은 사용자의 글이다: `조사 없이 이 설계를 수용`, 설명 `네트워크 조건은 그대로 둡니다. 조사 없이 이 설계와 그 위험을 받아들인다고 결정합니다. SM이 이 결정과 빠진 자료를 Story에 적고, Story는 조사 요건을 채웠다고 적지 않습니다. 남는 위험: 스택 크기를 바꾼 실행과 다른 런타임의 동작이 확인되지 않습니다.` 조사 요건은 채워지지 않았다. AC, 부모 요구, 필수 점검은 이 면제가 덮지 않으며 모두 따로 통과했다. 다른 Story, 공용 결정, 새 발생으로 넓어지지 않는다."
  approved_by: "사용자, 2026-11-07, PO 검증 1회의 PO1-B1을 두고 메인 세션이 물은 질문에 대한 선택. 이 run의 지시가 원문을 전달했고 Story의 수용된 결정에 같은 글이 있다"

