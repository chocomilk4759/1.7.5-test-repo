# -- 활성 지적 --
top_issues:
  - id: TEST-003
    severity: low
    disposition: optional
    confidence: high
    suggested_owner: dev
    finding: "변이 `(value / target.size) * size`(배율 단위가 목표 크기로 먼저 나눔)가 전달 시험 20개를 모두 통과한다. 이 변이는 `convert(1e307, \"mm\", \"cm\")`에서 중간 값이 넘쳐 Infinity를 돌려주는데 참값은 1e306이다. 새 압력 시험은 기준 단위를 거치는 변형을 잡지만 목표 크기가 1보다 작은 쌍을 들지 않는다. 실제 코드는 1e306을 돌려주어 잘못된 결과가 없다. 어떤 점검이나 시나리오도 이 사례를 이름 붙이지 않아 3단계의 기준이 아니고, 틀린 구현이 통과할 가능성은 3단계의 기준을 통해서만 막으므로 비차단이다. 수정된 코드에서 생긴 변이여서 늦은 지적이 아니다."
    failure_scenario: "뒤의 수정이 계산 순서를 이 꼴로 바꾸면 REL-001과 같은 실패가 길이 단위에서 생겨도 시험이 통과한다."
    suggested_action: "처리를 정한다. 적용하면 참값이 범위 안이고 목표 크기가 1보다 작은 길이 행(예: `{ mm: 1e307, cm: 1e306 }`)을 시험에 더하며 제품 코드는 바꿀 일이 없다. 적용하지 않으면 `tasks/apply-qa-fixes.md`대로 future 기록과 처리 줄을 남긴다. 계약 안이다."
    refs:
      - "src/units.js, `scaledUnits`의 `convertTo`"
      - "test/units.test.js, 시험 \"converts a pressure that is out of range in pascals\""
    first_round: 2
    verification: "변이 사본에서 전달 시험 20개가 통과하고, 같은 사본에서 convert(1e307, \"mm\", \"cm\")와 convert(1e306, \"cm\", \"mm\")가 Infinity다. 전달 모듈은 1e+306과 1e+307을 돌려준다."

# -- 닫힌 지적과 처분 --
resolved_issues:
  - id: TEST-001
    severity: low
    disposition: required
    first_round: 1
    resolved_round: 2
    verdict: RESOLVED
    resolution: "시험 \"returns a value unchanged when both units are the same\"의 주석을 \"A conversion to the same unit returns a value near the largest double as it is, in a unit of each kind\"로 고쳤다(커밋 3009f33). 네 행의 단언과 맞고 넘침을 말하지 않는다. 지적의 기준(CC-CMT-010 아래 문장)이 충족된다. 점검 문구는 이 회차의 판단대로 적용되지 않는다(회차 note)."
    refs:
      - "test/units.test.js, 시험 \"returns a value unchanged when both units are the same\"의 주석"
      - "docs/story-records/1.2/dev-3.2.md, 섹션 'TEST-001'과 Cleaner 결과의 F1"
    verification: "1회차 확인: 같은 단위 반환을 지운 사본에서 C 행만 넘치지 않았다. 2회차 확인: 현재 코드의 같은 사본에서 네 행이 모두 같은 값이고 전달 시험 20개가 통과한다. 새 주석은 그 변형의 실패를 말하지 않으므로 거짓이 아니다."
  - id: TEST-002
    severity: low
    disposition: required
    first_round: 1
    resolved_round: 2
    verdict: RESOLVED
    resolution: "같은 입력의 호출을 지역 함수 `convertSample` 하나로 모아 리터럴 `1`이 한 곳에 있다(커밋 3009f33). 상태가 남는 변이를 이 시험만 돌리면 첫 호출 뒤의 비교에서 실패한다."
    refs:
      - "test/units.test.js, 시험 \"keeps no state between calls, also after an error\""
      - "docs/story-records/1.2/dev-3.2.md, 섹션 'TEST-002'"
    verification: "1회차 확인: 숫자 리터럴을 모두 읽어 이 시험의 `1` 셋만 함께 바뀌어야 함을 보았다. 2회차 확인: 시험 파일의 `convert(1, \"m\", \"cm\")`가 1곳이고, 변이 '오류 뒤 상태'에 시험 이름 필터로 이 시험만 돌려 종료 상태 1, 메시지 'Expected values to be strictly equal'이다."
  - id: REL-001
    severity: low
    disposition: recommended
    first_round: 1
    resolved_round: 2
    verdict: RESOLVED
    resolution: "`src/units.js`의 배율 단위가 크기의 비로 곱하고 온도가 9 / 5로 곱하거나 나눈다(커밋 9ede139). 시험 \"converts a pressure that is out of range in pascals\"와 \"converts a large temperature in every unit\"가 16쌍을 덮고, 오라클의 같은 표본에서 해당 결과가 984건에서 0건이 되었다. 범위 끝의 반올림 오차 안(1 ulp 미만)은 원인과 경계가 달라 리드로 두었다(회차 note). DEV-1의 처리 줄은 fix로 바뀌었다."
    refs:
      - "src/units.js, `scaledUnits`의 `convertTo`, `FAHRENHEIT_PER_CELSIUS`, `convert`의 JSDoc"
      - "test/units.test.js, 시험 \"converts a pressure that is out of range in pascals\", \"converts a large temperature in every unit\""
      - "docs/story-records/1.2/dev-3.1.md, 섹션 '진단'과 '조각별 실행 기록'"
    verification: "1회차 확인: 프로젝트 루트에서 convert(1e303, \"MPa\", \"kPa\")와 convert(1e308, \"F\", \"C\")가 Infinity이고, 유리수 오라클 28만 호출에서 참값이 범위 안인 Infinity가 984건이며 모두 16쌍이었다. 2회차 확인: 두 입력이 1e+306과 5.555555555555556e+307이고, 같은 표본에서 0건이며, 참값이 범위를 넘는 Infinity 1329건은 그대로다. 정규 범위의 배율 변환 어긋남은 0건이다."
  - id: DOC-001
