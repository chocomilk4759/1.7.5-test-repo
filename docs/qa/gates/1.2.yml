# -- 활성 지적 --
top_issues:
  - id: TEST-001
    severity: low
    disposition: required
    confidence: high
    suggested_owner: dev
    finding: "시험 \"returns a value unchanged when both units are the same\" 위의 주석 \"Converting these through the reference unit of their kind would overflow\"는 `cases`의 네 행 모두를 말하는데, 행 `[Number.MAX_VALUE, \"C\"]`는 넘치지 않는다. `C`는 온도의 기준 단위이고 두 환산 함수가 값을 그대로 돌려주기 때문이다. 기준은 CC-CMT-010 표 아래의 문장 \"Test names, headers and comments must describe what the test actually reaches and asserts\"와 `tasks/code-comment-style.md` 섹션 3이다. 이 시험은 Cleaner 지적 F4로 Cleaner 검토 뒤에 더해져 그 검토를 거치지 않았다."
    failure_scenario: "읽는 사람이 이 행도 넘침을 잡는 회귀 행이라고 믿는다. 같은 단위 반환을 지운 변형에서 이 행은 같은 값을 돌려주어 넘침을 잡지 못한다."
    suggested_action: "그 행을 빼거나 주석을 실제로 넘치는 행으로 한정한다. REL-001을 고치면 기준 단위를 거쳐도 넘치지 않는 행이 늘어나므로, 고친 코드에 맞춰 주석과 행을 함께 다시 쓴다. 점검: 같은 단위 반환을 지운 변형에서 남긴 행이 주석이 말한 대로 실패하고 프로젝트 루트의 `node --test`가 통과한다."
    refs:
      - "test/units.test.js, 시험 \"returns a value unchanged when both units are the same\"의 주석과 `cases`"
      - "src/units.js, `UNITS`의 `C` 항목과 `convert`의 같은 단위 반환"
      - "docs/conventions/Common/sections/comments.md, Comment Quality의 CC-CMT-010 아래 문단"
    first_round: 1
    verification: "같은 단위 반환을 지운 사본에서 네 행을 실행했다. 1e308 km, 1e308 MPa, 1e308 F는 Infinity이고 Number.MAX_VALUE C는 1.7976931348623157e+308로 같은 값이다. 나머지 주석과 시험 이름은 모두 읽어 단언과 맞음을 확인했다."
  - id: TEST-002
    severity: low
    disposition: required
    confidence: medium
    suggested_owner: dev
    finding: "시험 \"keeps no state between calls, also after an error\"가 같은 입력 `convert(1, \"m\", \"cm\")`를 숫자 리터럴 `1`로 세 번 적는다. 뒤의 두 호출은 첫 호출의 결과 `first`와 비교하므로 입력을 바꾸려면 세 곳을 함께 고쳐야 한다. 기준은 CL-GLD-001의 Numeric literals 1단계 \"The same quantity ... is written as a literal in more than one place, so that changing the quantity means editing each occurrence\"이다. Cleaner 지적 F7로 같은 시험의 `100`은 고쳤지만 입력은 남았다."
    failure_scenario: "입력을 한 곳만 바꾸면 이 시험이 호출 사이의 상태 때문이 아니라 입력이 달라서 실패한다."
    suggested_action: "시험 안에서 입력에 이름을 주거나 호출을 이름 있는 지역 함수 하나로 모은다. 점검: 오류 뒤에 상태가 남는 변형이 이 시험에서 실패하고 `node --test`가 통과한다."
    refs:
      - "test/units.test.js, 시험 \"keeps no state between calls, also after an error\""
      - "docs/conventions/Common/sections/coding-principles.md, Numeric literals의 1단계"
      - "docs/story-records/1.2/dev-1.1.md, Cleaner 결과의 F7"
    first_round: 1
    verification: "시험 파일의 숫자 리터럴을 모두 읽어 1단계부터 분류했다. 이 시험의 `1` 셋만 함께 바뀌어야 하는 같은 입력이다. 버린 후보와 결정한 단계는 회차 note에 있다."
  - id: REL-001
    severity: low
    disposition: recommended
    confidence: high
    suggested_owner: dev
    finding: "참값이 double 범위 안인 변환이 Infinity를 돌려준다. `convert(1e303, \"MPa\", \"kPa\")`는 참값이 1e306이고 `convert(1e308, \"F\", \"C\")`는 참값이 약 5.56e307인데 둘 다 Infinity다. `convert`가 모든 환산을 기준 단위(Pa, C)로 거치며 중간 값이 넘치기 때문이다. 해당 쌍은 kPa, MPa, bar, psi 사이의 12개와 C→F, K→F, F→C, F→K이고 길이 쌍은 없다. `convert`의 JSDoc \"a result beyond the range of a double is an infinity\"도 범위 안의 결과는 말하지 않는다. Dev가 DEV-1(future)로, PO가 PO1-N1의 더한 관찰로 적은 것과 같은 입력이다. 수용된 값 범위는 Testing \"지원 입력\"의 \"number 형이고 유한한 수\"이고, \"받는 입력 가운데 결과가 유한하지 않은 경우만 표 3이 두 결과를 받는다\"이며, 표 3은 참값이 범위를 넘는 세 입력만 든다. 어떤 시나리오도 이 사례를 이름 붙이지 않아 3단계의 기준은 아니고, 4단계에서 AC 1의 수용된 쓰임에 틀린 값을 돌려주는 실패로 확인되어 차단이다."
    failure_scenario: "호출자가 유한한 값을 범위 안의 값으로 변환하고 오류 없이 Infinity를 받는다. 입력 크기는 MPa 약 1.8e302, bar 약 1.8e303, psi 약 2.6e304, kPa 약 1.8e305, C와 K에서 F로 약 2.0e307, F에서 C와 K로 약 3.6e307부터다. 실무의 값에는 닿지 않아 심각도는 낮다."
    suggested_action: "수용된 계약 안에서 고친다. 배율 단위는 비율을 먼저 구해 곱하고(`value * (from 크기 / to 크기)`), 온도는 1.8로 곱하거나 나누어 중간 값이 넘치지 않게 한다. Story의 Dev Notes가 `(F - 32) / 1.8`의 절대 영도 값을 이미 든다. CC-TDD-005대로 재현 시험을 먼저 더해 실패를 본 뒤 고치고, `convert`의 JSDoc과 온도 상수의 주석을 맞추며, Completion Notes의 DEV-1 기록과 처리 줄을 `tasks/apply-qa-fixes.md`대로 갱신한다. 참값이 범위를 넘는 입력의 결정(N-1, PO1-N1)은 그대로 열려 있고 이 수정은 그 답에 기대지 않는다. 점검: 재현 시험, 표 1과 표 3의 행, T-5, 프로젝트 루트의 `node --test`."
    refs:
      - "src/units.js, `convert`, `scaledUnits`, `UNITS`의 `F` 항목"
      - "docs/stories/1.2.story.md, Acceptance Criteria의 1, Testing의 '지원 입력'과 '표 3'"
      - "docs/stories/1.2.story.md, Completion Notes의 DEV-1 항목과 PO Validation의 PO1-N1"
    first_round: 1
    verification: "프로젝트 루트에서 두 입력을 실행해 Infinity를 보았다. 제품과 코드를 나누지 않은 유리수 오라클(표본 28만 호출)에서 참값이 범위 안인데 유한하지 않은 결과가 984건이고 모두 위 16쌍이다. 같은 오라클에서 정규 범위의 배율 변환 어긋남은 0건이다. 사본에 위 수정을 넣으면 전달 시험 18개가 모두 통과하고, 위 건수가 0건이 되며, 표 3의 세 입력은 그대로 Infinity이고 -459.67 F는 0 K다."
  - id: DOC-001
    severity: low
    disposition: optional
    confidence: high
    suggested_owner: dev
    finding: "dev-1.1의 Cleaner 결과에 있는 문장 \"시험 파일의 문자 `°`를 이스케이프(`°`)로 바꿔\"는 이스케이프 자리에도 문자가 적혀 있다. 시험 파일에는 실제로 이스케이프가 있고 파일이 ASCII이므로 사실은 맞고 표현만 부정확하다. Dev 질문 4의 도구 성질이 이 문장에서 드러난 것이다."
    failure_scenario: "기록만 읽는 사람은 무엇으로 바꿨는지 알 수 없다."
    suggested_action: "다음 Dev 기록에서 앞 문장을 고쳐 쓰지 않고 바로잡는다. 계약 안이다."
    refs:
      - "docs/story-records/1.2/dev-1.1.md, Cleaner 결과의 지적과 처분 아래 '시험 파일의 문자' 문장"
      - "test/units.test.js, 시험 \"rejects a unit that is not listed, in either position\"의 `degC` 앞 값"
    first_round: 1
  - id: DOC-002
    severity: low
    disposition: optional
    confidence: medium
    suggested_owner: dev
    finding: "Dev Notes의 \"Dev는 구현 전에 다시 확인한다\"에 대응하는 기록이 dev-1.1과 Completion Notes에 없다. 같은 값이 나오는 Dev의 실행 출력은 모두 구현 뒤의 것이다. QA가 Dev Notes의 값 여덟 개를 다시 실행해 모두 같음을 확인했으므로 근거는 유효하다. 그 문장은 결과의 기록을 요구하지 않고 어떤 시나리오도 이름 붙이지 않아 3단계의 기준이 아니며, 4단계의 실패도 없어 비차단이다."
    failure_scenario: "값이 환경에 따라 달랐다면 구현 전에 알지 못했을 것이다. 지금 환경에서는 값이 같아 실제 영향이 없다."
    suggested_action: "다음 Dev 기록에 이 재확인을 했는지 사실대로 적는다. 하지 않았으면 빠진 증거로 적고 뒤에 만들지 않는다. 계약 안이다."
    refs:
      - "docs/stories/1.2.story.md, Dev Notes의 '기술 제약'에서 'Draft 때 Node.js v24.22.1에서 계산한 배정밀도 값' 문단"
      - "docs/story-records/1.2/dev-1.1.md, 섹션 '선택한 해석과 구현 결정'"
    first_round: 1

