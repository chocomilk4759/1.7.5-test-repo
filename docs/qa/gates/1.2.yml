# -- 품질 속성과 근거 --
nfr_validation:
  security:
    status: "PASS"
    notes: "적용되는 기준은 CC-JS-004의 경계 검증이다. 값은 Number.isFinite로, 기호는 Map의 정확한 키로, 종류는 ===로 판정하고, 적대 입력 17개(Symbol, Date, valueOf와 toString을 가진 객체, String 객체, 0, false, NaN 등)가 모두 ConversionError다. 가져오는 모듈, 입출력, eval, 비밀 값이 없고 오류 메시지가 입력을 되풀이하지 않는다."
  performance:
    status: "N/A"
    notes: "수용된 성능 기준과 이 변경에 닿는 실행 비용 규칙이 없다. 산술과 작은 Map 조회뿐이어서 측정 기준을 만들지 않았다."
  reliability:
    status: "CONCERNS"
    notes: "유리수 오라클 28만 호출에서 정규 범위의 배율 변환 어긋남은 0건이고 절대 영도 경계의 결과가 목표 단위의 하한 아래로 내려가지 않으며 호출 사이의 상태가 없다. 참값이 범위 안인데 Infinity인 결과가 남았다(REL-001). 0에 가까운 결과의 정밀도는 Story가 N-4로 범위 밖에 두었다."
  maintainability:
    status: "PASS"
    notes: "공개 심볼 셋 뒤에 단위 표, 검사 순서, 환산을 숨긴 모듈이고 공개 인터페이스로만 시험한다. 변이 83개 가운데 계약이 허용하는 8개만 통과했다. CRAP은 quality.crap.commands가 비어 측정하지 않았고, 이것은 통과도 차단도 아니다. 시험 안의 작은 위반은 TEST-001, TEST-002다."

