      TEST-003 지적: 단항 마이너스가 항을 삼키는 변형, 곱셈의 오른쪽 0을 거부하는 변형, `CalculationError`를 `Error`의 별칭으로 둔 변형이 시험을 통과했다. 실패 시나리오: 뒤의 수정이 이것들을 깨뜨려도 시험이 통과한다. 조치: `8 / -2 * 3` → -12, `7 * 0` → 0 행과 평범한 `Error`와의 구별 단언을 더한다.
