    severity: low
    disposition: optional
    confidence: high
    suggested_owner: dev
    finding: "Dev 기록의 두 문장이 저장된 Story와 다르다. dev-dod-2의 프로젝트 정책 점검에서 행 `현재 작업과 사실, 편집 이력은 지정된 기록에`는 e71238d와 비교해 `지운 줄이 없음을 확인했다`고 적는데, Status를 빼고도 File List의 세 줄이 고쳐 쓰였다. dev-qa-r2의 REQ-002 분석은 `현재 계획의 글(Dev Notes, Testing, 표)에는 40이 없다`고 적는데, Dev Notes의 `폭 결정을 코드에 옮기는 일` 1번과 1.3-INT-001 행 등에 옛 규칙의 값 40이 있다. 두 문장이 말하려는 사실(앞선 기록을 고쳐 쓰지 않았다, 계획이 요구하는 값은 48이다)은 맞고 File List의 수정은 Dev의 권한 안이다. Story 자신의 기록 구역과 계획에 대한 문장이어서 결정 순서 step 3의 `description of current content`가 아니고, 다른 결과를 정하는 두 문장의 모순도 아니며, 잘못된 결과가 없어 step 4도 아니다. 비차단이다. 이 회차가 처음 보는 Dev 기록이어서 늦은 지적이 아니다."
    failure_scenario: "뒤의 검토자가 이 문장을 믿으면 File List의 세 줄을 앞선 글 그대로라고 읽거나, 옛 값 40이 남은 곳을 찾을 범위를 잘못 좁힌다. 제품, 시험, 필수 점검의 결과에는 닿지 않는다."
    suggested_action: "Dev가 처리를 정해 Completion Notes에 처리 줄을 남긴다(`check-done.sh`가 활성 Optional마다 요구한다). 적용하면 앞선 기록을 고쳐 쓰지 않고 Completion Notes의 새 항목에서 두 문장을 정정하며 코드와 시험은 바꾸지 않는다. `tasks/apply-qa-fixes.md`대로 `fix`는 QA 회차가 닫아야 Done으로 갈 수 있고, `future`면 지적, 출처, 적용하지 않는 까닭, 필요한 일을 적은 future 기록이 함께 있어야 한다. 기존 future-work 항목 `[Tech-Debt] 재발: 기록의 서술이 실제와 다름`과 같은 기준이다. 계약 안이다."
    refs:
      - "docs/story-records/1.3/dev-dod-2.md, 섹션 `프로젝트 정책 점검`의 행 `현재 작업과 사실, 편집 이력은 지정된 기록에`"
      - "docs/story-records/1.3/dev-qa-r2.md, 섹션 `REQ-002 Story의 수용된 결정과 계획의 글이 사용자의 결정과 어긋난다`의 `확인`"
      - "docs/stories/1.3.story.md, File List, Dev Notes의 `폭 결정을 코드에 옮기는 일`, Testing의 1.3-INT-001"
    first_round: 3
    verification: "`git diff e71238d 6701dcd -- docs/stories/1.3.story.md`의 지운 줄은 Status의 InProgress와 File List의 세 줄(`src/screen.js` (새 파일), `test/screen.test.js` (새 파일), 기준 `40e1a6b`와 차이 없음을 적은 바꾸지 않음 줄)이다. Dev의 섹션 비교 도구는 섹션마다 같음과 바뀜만 출력하고 지운 줄을 세지 않는다. 저장된 Story에서 SM 소유 섹션의 40을 검색해 Dev Notes의 `규칙이 40이어서`, `got 40`, `규칙 40으로 낸 결과`를 읽었다. 그 밖의 Dev 기록의 값(RED와 GREEN의 출력, 변형 결과, 커밋, 파일 수, 해시, 줄 길이)은 이 회차의 실행과 모두 같다."

