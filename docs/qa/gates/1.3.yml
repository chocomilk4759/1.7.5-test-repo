hat evaluate throws when that is not a calculation error`는 판정 방법의 같은 오류와 같은 뜻이고 코드에 대해 참이어서 CC-CMT-010의 거짓 주장이 아니다. `7 +` 줄의 길이 단언은 Story의 E-2가 전제를 적었고 틀릴 때 조용히 지나가지 않으며 엔진 변경은 뒤의 변경이어서 PO1-N4에 합쳤다. 커밋 5ca0d47의 시각 정정은 Dev 자기 기록의 정체 정보를 같은 작업 안에서 고친 것이고 결과를 바꾸지 않으며 고친 값이 커밋 시각과 맞다. dev-1.1의 `rethrow-*`(실제 폴더는 `rebuild-*`)와 File List의 설명(Status, Change Log를 빠뜨림)은 사실이 맞고 표현만 덜 정확하며 완전한 목록으로 쓰지 않았다. 80칸을 넘는 시험 이름 줄 다섯은 CC-JS-002의 선호 폭이고 줄바꿈할 수 없다. JSDoc의 `오류: `는 AC 2의 표시 글자 인용이다. 공백 정의가 엔진과 겹치는 것은 엔진에 공개 심볼이 없고 N-1이 미결이라 지금 합칠 수 없다. `let value;`는 try를 evaluate로 좁히려는 재바인딩이어서 CC-JS-001에 맞다. CRAP은 측정하지 않음이며 제안은 기존 항목이 들고 있다."

