    severity: medium
    disposition: required
    confidence: high
    suggested_owner: dev
    finding: "필수 점검 1.3-INT-001이 기준 브랜치의 tip 위에서 실패한다. `main`의 커밋 cb50c3c(요청 #10, Story의 Done 커밋 뒤에 병합됨)가 `ci/screen-rule.check.mjs`의 `EXPECTED_WIDTH`를 48로 올렸고 `src/screen.js`는 `SCREEN_WIDTH = 40`을 내보낸다. 늦은 지적이다: 회차 1과 완료 점검 때 규칙은 40이어서 이 점검이 통과했고, 병합 작업의 사본 검증이라는 Done 뒤의 점검이 찾았다."
    failure_scenario: "요청 #9를 갱신하거나 병합하면 기준 tip의 규칙이 적용되어 `node ci/screen-rule.check.mjs`가 `src/screen.js must export SCREEN_WIDTH = 48, got 40`으로 종료 상태 1이 되고, 병합 작업의 사본 검증이 멈춘다."
    suggested_action: "REQ-002의 SM 수정과 PO 재검증 뒤에 Dev가 `tasks/apply-qa-fixes.md`로 고친다. 먼저 기준 tip d90c99e2f6e4d94e17d755fd4b4a5ac672f0b685를 `[story-1.3] Story Base: main at d90c99e2f6e4d94e17d755fd4b4a5ac672f0b685` 병합 커밋으로 들여오고, 그 위에서 `src/screen.js`의 `SCREEN_WIDTH`를 48로 바꾸며 `test/screen.test.js`의 `DISPLAY_WIDTH`와 시험 `returns a line longer than the display whole`을 수정된 계획대로 맞춘다. 폭은 줄의 모양에 쓰이지 않아 `renderScreen`의 결과는 바뀌지 않는다. 기대 점검: `node --test` 전체 통과, `node ci/screen-rule.check.mjs` 종료 상태 0."
    refs:
      - "ci/screen-rule.check.mjs, `EXPECTED_WIDTH`(main의 cb50c3c 뒤 48)"
      - "src/screen.js, `SCREEN_WIDTH`"
      - "test/screen.test.js, `DISPLAY_WIDTH`, 시험 `returns a line longer than the display whole`"
      - "docs/stories/1.3.story.md, Testing의 1.3-INT-001, Scope and Dependencies의 `결과와 범위`"
    first_round: 2
    verification: "2026-11-06 20:29 +0900, Node.js v24.22.1, Story의 작업 트리의 detached HEAD. Done 커밋을 d90c99e 위로 되감은 사본 552b97d와 d90c99e를 병합한 사본 5f0520b에서 `node --test` 68개 통과, `node ci/screen-rule.check.mjs` 종료 상태 1, 출력 `src/screen.js must export SCREEN_WIDTH = 48, got 40`. Done 커밋 자체(규칙 40)는 48개 통과와 종료 상태 0, Story의 변경이 없는 d90c99e(화면 파일 없음)는 55개 통과와 종료 상태 0이다."
  - id: REQ-002
    severity: medium
    disposition: required
    confidence: high
    suggested_owner: sm
    finding: "Story의 수용된 결정과 계획의 글이 사용자의 결정과 어긋난다. 사용자가 2026-11-06에 Story 1.3의 `SCREEN_WIDTH`를 48로 정했는데, Scope and Dependencies의 `메인 세션의 답`과 입력 표, Dev Notes의 `값이 40인 상수`와 `40글자를 넘을 수 있고`, Testing의 R-4, 1.3-UNIT-003, 1.3-INT-001, 추적 표, 가져오기 검색의 통과할 줄이 40을 적는다. E-2의 `7 +` 줄은 46글자여서 폭 48을 넘지 않아 `자르지 않음도 함께 본다`는 전제가 성립하지 않는다. 이 회차의 새 입력에서 나온 지적이어서 늦은 지적이 아니다."
    failure_scenario: "계획을 고치지 않으면 Dev가 따를 계획이 40을 요구해 REQ-001의 수정과 충돌하고, 1.3-UNIT-003의 길이 단언을 폭 48로 올리면 시험 `returns a line longer than the display whole`이 `7 +` 줄에서 실패한다."
    suggested_action: "SM이 `tasks/create-next-story.md`의 revision으로 사용자의 답을 글, 근거, 결정자, 범위와 함께 Scope and Dependencies에 저장하고 위 계획의 글과 Story의 기준 서술을 고친다. 폭을 넘는 오류 줄의 입력이나 단언을 어떻게 둘지도 계획이 정한다. Status는 InProgress 그대로이고, PO가 `tasks/validate-next-story.md`로 영향받은 입력을 재검증한다. 앞선 PO, Dev, QA 기록은 고치지 않는다."
    refs:
      - "docs/stories/1.3.story.md, Scope and Dependencies의 `수용된 결정`과 입력 표"
      - "docs/stories/1.3.story.md, Dev Notes의 `인터페이스와 파일 위치`, `기술 제약`"
      - "docs/stories/1.3.story.md, Testing의 표 1 R-4, 표 2 E-2, 1.3-UNIT-003, 1.3-INT-001, `추적`, `가져오기 검색`"
    first_round: 2
    verification: "저장된 Story를 읽어 40과 46이 적힌 문장을 찾았다. 일반 사본 시험: `SCREEN_WIDTH`만 48이면 68개 통과와 규칙 종료 상태 0, 시험의 `DISPLAY_WIDTH`도 48이면 67개 통과와 1개 실패(`returns a line longer than the display whole`의 `assert.ok(longErrorLine.length > DISPLAY_WIDTH)`)다. 지금 엔진에서 `오류:` 줄의 길이는 `7 +`가 46글자이고, 뒤 공백으로 위치를 100으로 밀면 48글자, 1000으로 밀면 49글자다."
  - id: TEST-001
    severity: low
    disposition: optional
    confidence: high
    suggested_owner: dev
    finding: "`evaluate`에 받은 글자를 그대로 넘긴다는 규칙(N-3, 표 2의 E-4, E-5)의 시험이 틀린 변형 둘을 놓친다. 끝의 U+0020을 지우고 넘기는 변형과 CR을 지우고 넘기는 변형이 전달 시험 13개와 CI 규칙을 모두 통과한다. E-4의 행 중 뒤 공백이 있는 `7 + a`는 뒤 공백을 지워도 `a`의 위치가 4로 같아 이 변형을 가리지 못하고, E-5의 행에는 CR이 없다. 전달된 코드는 `evaluate(expression)`이어서 맞다."
    failure_scenario: "뒤의 수정이 이 꼴로 입력을 손보면 뒤 공백 둘이 있는 `7 +`의 줄이 위치 5 대신 위치 3을 말하고, `1`과 `+ 2` 사이에 CR이 있는 식이 오류 줄 대신 CR이 든 값 줄이 되어도 시험이 통과한다."
    suggested_action: "Dev의 처리 줄은 `future`이고 Completion Notes의 future 기록은 Story가 다른 까닭으로 InProgress로 돌아오면 같은 Story에서 고친다고 적었다. 이 다시 열기로 그 때가 왔다. 고치면 시험 `reports an error at its position in the expression as received`에 뒤 공백 둘이 있는 `7 +`를, 시험 `does not take white space other than a space for a space`에 `1`과 `+ 2` 사이에 CR이 있는 식을 더하고 `Treatment: TEST-001 fix` 줄을 남기며 제품 코드는 바꿀 일이 없다. 계약 안이다."
    refs:
      - "src/screen.js, `renderScreen`의 `evaluate(expression)`"
      - "test/screen.test.js, 시험 `reports an error at its position in the expression as received`, `does not take white space other than a space for a space`"
      - "docs/stories/1.3.story.md, Testing 표 2의 E-4, E-5와 1.3-UNIT-005의 실패 기준"
    first_round: 1
    verification: "변이 사본 pass-no-trailing-u0020과 pass-no-carriage-returns에서 전달 시험 13개가 통과하고 CI 규칙이 종료 상태 0이다. 그 사본에서 뒤 공백 둘이 있는 `7 +`는 position 3의 오류 줄이고 CR이 든 식은 값 줄이다. 전달 모듈은 같은 두 입력에 position 5와 position 1의 오류 줄을 돌려준다."

