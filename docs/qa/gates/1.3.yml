    note: "적용 정책: 현재 data/finding-classification.md, tasks/reopen-story.md, tasks/qa-gate.md의 다시 열기 회차 규칙, documentation 본문. 이 회차의 저장 줄은 QA Results 항목의 Reopen 줄이다(병합 작업의 사본 검증, CI 규칙 실패, *run-story 1.2 1.3 remote). 사용자 결정 2026-11-06, 범위 Story 1.3의 SCREEN_WIDTH와 이 다시 열기, 답 원문 'Story를 48로 (Recommended)'. 결론: 활성 Required 둘이어서 FAIL, Status는 Done에서 InProgress다. 늦은 지적 REQ-001은 회차 1과 완료 점검이 통과로 본 1.3-INT-001을 뒤집는다(회차 1). 까닭은 규칙이 Done 커밋 뒤에 바뀌어 Done 뒤의 점검만 찾을 수 있었다는 것이고, 다음 리뷰는 새 세션의 전체 리뷰다. 분류의 변화: 답 전의 판정 작업은 같은 실패를 pending(결정의 소유자)으로 분류해 질문하고 아무것도 바꾸지 않았다. 사용자의 답이 결정을 정해 rework가 되었고, 코드와 시험은 Dev(REQ-001), 수용 결정과 계획의 글은 SM(REQ-002)이다. REQ-002는 사용자의 답이라는 새 입력에서 나와 늦은 지적이 아니다. TEST-001은 처분 optional 그대로이고 처리 줄을 바꾸지 않았으며 suggested_action만 새로 적었다. comment_hygiene, evidence.trace, nfr_validation은 제품과 시험이 회차 1의 입력과 같아 회차 1의 결과를 잇는다. AC 1 ~ 3은 바뀌지 않았고 사본의 화면 시험 13개가 통과한다. 리드: 서비스 CI test도 같은 점검에서 실패할 것이다(ci.yml이 같은 두 명령을 돌리고 merge 사본이 실패한다). 확인하려면 요청 #9의 갱신이 필요한데 사본 검증이 실패해 하지 않았다. 기각: 환경의 실패(결과가 값의 차이로 정해지고 같은 명령이 Done 커밋과 기준 tip에서 통과한다). 두 Story의 충돌(Story 1.2의 스쿼시 f6f690b는 ci, .github, 화면 파일을 바꾸지 않았고 규칙을 바꾼 것은 Chore 커밋 cb50c3c다). contract(AC, PRD, Architecture에 폭이 없고 답이 범위를 바꾸지 않는다). 1.3-UNIT-011의 차이(40e1a6b와 비교하면 ci 파일 한 줄이 다르나 기준의 이동이고 기준 tip과는 같다). Story의 Story 1.2는 main에 없다는 서술(같은 문단이 입력을 커밋 40e1a6b로 묶은 기준 서술이어서 따로 올리지 않고 REQ-002의 SM 수정에 맡긴다). 닫기 전 원문 보존(3회차에 닫은 지적을 옮기며 더함). REQ-001 finding: 필수 점검 1.3-INT-001이 기준 브랜치의 tip 위에서 실패한다. `main`의 커밋 cb50c3c(요청 #10, Story의 Done 커밋 뒤에 병합됨)가 `ci/screen-rule.check.mjs`의 `EXPECTED_WIDTH`를 48로 올렸고 `src/screen.js`는 `SCREEN_WIDTH = 40`을 내보낸다. 늦은 지적이다: 회차 1과 완료 점검 때 규칙은 40이어서 이 점검이 통과했고, 병합 작업의 사본 검증이라는 Done 뒤의 점검이 찾았다. failure_scenario: 요청 #9를 갱신하거나 병합하면 기준 tip의 규칙이 적용되어 `node ci/screen-rule.check.mjs`가 `src/screen.js must export SCREEN_WIDTH = 48, got 40`으로 종료 상태 1이 되고, 병합 작업의 사본 검증이 멈춘다. suggested_action: REQ-002의 SM 수정과 PO 재검증 뒤에 Dev가 `tasks/apply-qa-fixes.md`로 고친다. 먼저 기준 tip d90c99e2f6e4d94e17d755fd4b4a5ac672f0b685를 `[story-1.3] Story Base: main at d90c99e2f6e4d94e17d755fd4b4a5ac672f0b685` 병합 커밋으로 들여오고, 그 위에서 `src/screen.js`의 `SCREEN_WIDTH`를 48로 바꾸며 `test/screen.test.js`의 `DISPLAY_WIDTH`와 시험 `returns a line longer than the display whole`을 수정된 계획대로 맞춘다. 폭은 줄의 모양에 쓰이지 않아 `renderScreen`의 결과는 바뀌지 않는다. 기대 점검: `node --test` 전체 통과, `node ci/screen-rule.check.mjs` 종료 상태 0. verification: 2026-11-06 20:29 +0900, Node.js v24.22.1, Story의 작업 트리의 detached HEAD. Done 커밋을 d90c99e 위로 되감은 사본 552b97d와 d90c99e를 병합한 사본 5f0520b에서 `node --test` 68개 통과, `node ci/screen-rule.check.mjs` 종료 상태 1, 출력 `src/screen.js must export SCREEN_WIDTH = 48, got 40`. Done 커밋 자체(규칙 40)는 48개 통과와 종료 상태 0, Story의 변경이 없는 d90c99e(화면 파일 없음)는 55개 통과와 종료 상태 0이다. REQ-002 finding: Story의 수용된 결정과 계획의 글이 사용자의 결정과 어긋난다. 사용자가 2026-11-06에 Story 1.3의 `SCREEN_WIDTH`를 48로 정했는데, Scope and Dependencies의 `메인 세션의 답`과 입력 표, Dev Notes의 `값이 40인 상수`와 `40글자를 넘을 수 있고`, Testing의 R-4, 1.3-UNIT-003, 1.3-INT-001, 추적 표, 가져오기 검색의 통과할 줄이 40을 적는다. E-2의 `7 +` 줄은 46글자여서 폭 48을 넘지 않아 `자르지 않음도 함께 본다`는 전제가 성립하지 않는다. 이 회차의 새 입력에서 나온 지적이어서 늦은 지적이 아니다. failure_scenario: 계획을 고치지 않으면 Dev가 따를 계획이 40을 요구해 REQ-001의 수정과 충돌하고, 1.3-UNIT-003의 길이 단언을 폭 48로 올리면 시험 `returns a line longer than the display whole`이 `7 +` 줄에서 실패한다. suggested_action: SM이 `tasks/create-next-story.md`의 revision으로 사용자의 답을 글, 근거, 결정자, 범위와 함께 Scope and Dependencies에 저장하고 위 계획의 글과 Story의 기준 서술을 고친다. 폭을 넘는 오류 줄의 입력이나 단언을 어떻게 둘지도 계획이 정한다. Status는 InProgress 그대로이고, PO가 `tasks/validate-next-story.md`로 영향받은 입력을 재검증한다. 앞선 PO, Dev, QA 기록은 고치지 않는다. verification: 저장된 Story를 읽어 40과 46이 적힌 문장을 찾았다. 일반 사본 시험: `SCREEN_WIDTH`만 48이면 68개 통과와 규칙 종료 상태 0, 시험의 `DISPLAY_WIDTH`도 48이면 67개 통과와 1개 실패(`returns a line longer than the display whole`의 `assert.ok(longErrorLine.length > DISPLAY_WIDTH)`)다. 지금 엔진에서 `오류:` 줄의 길이는 `7 +`가 46글자이고, 뒤 공백으로 위치를 100으로 밀면 48글자, 1000으로 밀면 49글자다."

